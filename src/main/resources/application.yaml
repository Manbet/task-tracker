---
server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/task-tracker
    username: admin
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
      properties:
        hibernate:
          format_sql: true
application:
  jobs:
    notify-deadlines:
      cron: "0 0 0 * * *"
    flush:
      cron: "0 0 0 * * *"