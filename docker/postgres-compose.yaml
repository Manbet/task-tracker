version: "3.9"
services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - task-tracker-postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-tracker-postgres:5432/task-tracker
      SPRING_DATASOURCE_USERRNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
  task-tracker-postgres:
    image: postgres:16.3
    environment:
      POSTGRES_DB: "task-tracker"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    ports:
      - "5432:5432"
    volumes:
      - ./schema/init.sql:/docker-entrypoint-init.db/init.sql